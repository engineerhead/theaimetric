name: Refresh external model data
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch external data
        run: python3 script/fetch-external-data.py
      - name: Commit snapshot when it changed
        run: |
          if git diff --quiet -- _data/external.json; then
            echo "No change in external data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/external.json
          git commit -m "chore: refresh external model data snapshot"
          git push
